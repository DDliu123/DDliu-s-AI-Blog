  <path class="thin" d="M298 368 C309 398,315 425,332 456"/>
  <circle class="line" cx="373" cy="300" r="52"/>
  <path class="line" d="M407 337 L474 409"/>
  <path class="thin" d="M326 320 C306 335,302 356,313 378"/>

