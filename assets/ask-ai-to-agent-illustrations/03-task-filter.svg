  <path class="orange" d="M520 300 C568 285,628 289,667 319 C628 347,563 346,514 330 Z"/>
  <text class="note" x="539" y="325">有文件</text>
  <path class="orange" d="M521 386 C568 371,631 374,665 403 C622 430,560 429,515 412 Z"/>
  <text class="note" x="540" y="410">重复做</text>

  <path d="M364 311 C351 273,379 244,418 253 C454 262,468 292,454 329 C441 365,389 358,364 311 Z" fill="#111"/>
  <circle cx="392" cy="291" r="6" fill="#fff"/>
  <circle cx="423" cy="295" r="6" fill="#fff"/>
  <path class="thin" d="M379 357 C370 387,367 417,353 450"/>
  <path class="thin" d="M426 356 C436 388,442 416,456 449"/>
